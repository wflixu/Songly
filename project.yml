name: Songly

options:
  bundleIdPrefix: cn.wflixu
  deploymentTarget:
    iOS: "26.5"
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Songly:
    type: application
    platform: iOS
    sources:
      - path: Songly
    configFiles:
      Debug: Songly/Config/Debug.xcconfig
      Release: Songly/Config/Debug.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.Songly
        DEVELOPMENT_TEAM: 4L3563XCBN
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        # Custom build setting — read via AppEnvironment
        DEEPSEEK_API_KEY: $(DEEPSEEK_API_KEY)
    info:
      path: Songly/Info.plist
      properties:
        NSAppleMusicUsageDescription: "乐遇需要访问你的 Apple Music 收藏，以便 AI 为你生成个性化推荐歌单。"
        BGTaskSchedulerPermittedIdentifiers:
          - cn.wflixu.Songly.dailyRecommendation
        UIBackgroundModes:
          - fetch
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 乐遇
        DEEPSEEK_API_KEY: $(DEEPSEEK_API_KEY)

  SonglyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SonglyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.SonglyTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 4L3563XCBN
    dependencies:
      - target: Songly

  SonglyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SonglyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.SonglyUITests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 4L3563XCBN
    dependencies:
      - target: Songly
