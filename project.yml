name: Songly

options:
  bundleIdPrefix: cn.wflixu
  deploymentTarget:
    iOS: "26.5"
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Songly:
    type: application
    platform: iOS
    sources:
      - path: Songly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.Songly
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 4L3563XCBN
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1

  SonglyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SonglyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.SonglyTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 4L3563XCBN
    dependencies:
      - target: Songly

  SonglyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SonglyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wflixu.SonglyUITests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 4L3563XCBN
    dependencies:
      - target: Songly
